   id="svg2"
   sodipodi:docname="autorotate-active.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview2"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.2347851"
     inkscape:cx="88.568481"
     inkscape:cy="84.858807"
     inkscape:window-width="1920"
     inkscape:window-height="1200"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg2" />
  <defs
     id="defs1">
    <!-- Solid black arrowhead marker -->
    <marker
       id="arrowhead"
       viewBox="0 0 28 36"
       refX="4"
       refY="18"
       markerWidth="28"
       markerHeight="36"
       orient="auto"
       markerUnits="userSpaceOnUse">
      <polygon
         points="28,18 0,36 0,0 "
         fill="#000000"
         id="polygon1" />
    </marker>
    <!-- Base curved line using exact coordinates to ensure the gap falls perfectly at top/bottom center -->
    <path
       id="arrow-curve"
       d="M -18.12,67.61 A 70,70 0 0 1 -39.75,-57.62"
       fill="none"
       stroke="#000000"
       stroke-width="10"
       stroke-linecap="butt"
       marker-end="url(#arrowhead)" />
  </defs>
  <g
     transform="translate(74.998163,72.439518)"
     id="g2">
    <!-- Central Device (Phone) -->
    <rect
       x="-24"
       y="-40"
       width="48"
       height="80"
       rx="8"
       transform="rotate(45)"
       fill="#000000"
       id="rect1" />
    <!-- Left Circular Arrow (Starts bottom-left, ends top-left) -->
    <use
       href="#arrow-curve"
       id="use1" />
    <!-- Right Circular Arrow (Rotated 180 degrees to start top-right, end bottom-right) -->
    <use
       href="#arrow-curve"
       transform="scale(-1)"
       id="use2" />
  </g>
</svg>
